name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm test

      # A client URL in a commit message put this repo's employer and a client
      # domain on a public remote once already. Cheaper to block on the PR than
      # to rewrite history afterwards.
      - name: No private data
        run: python3 scripts/check-hygiene.py
